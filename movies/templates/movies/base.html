{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catálogo de películas{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 0 3rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #14161f; color: #e8e8ef; line-height: 1.5;
    }
    header {
      background: #1d2130; padding: 1.2rem 2rem;
      border-bottom: 3px solid #d8b84a;
    }
    header h1 { margin: 0; font-size: 1.4rem; color: #f3d77a; }
    header nav a { color: #9fb6e8; margin-right: 1rem; text-decoration: none; }
    header nav a:hover { text-decoration: underline; }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem; }
    h2 { color: #f3d77a; border-bottom: 1px solid #343a4e; padding-bottom: .3rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card {
      background: #1d2130; border: 1px solid #343a4e; border-radius: 8px; padding: 1rem;
    }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card h3 a { color: #e8e8ef; text-decoration: none; }
    .card h3 a:hover { color: #f3d77a; }
    .meta { color: #9aa3bd; font-size: .85rem; }
    .media { font-weight: 600; color: #8fd6a0; }
    .etiquetas { margin-top: .5rem; }
    .etiqueta {
      display: inline-block; background: #2a3047; color: #9fb6e8;
      border-radius: 999px; padding: .1rem .6rem; font-size: .75rem; margin-right: .3rem;
    }
    .vacio { color: #7c8399; font-style: italic; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #343a4e; font-size: .9rem; }
    th { color: #9fb6e8; }
    footer { text-align: center; color: #6f768c; font-size: .8rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Lab05 · Catálogo de películas</h1>
    <nav>
      <a href="{% url 'movies:movie_list' %}">Catálogo</a>
      <a href="/admin/">Panel de administración</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Desarrollo de Aplicaciones Empresariales · Lab05 · App movies (Django)
  </footer>
</body>
</html>
